services:
  postgres-upgrade:
    build: ./postgres-upgrade
    # image: akoscomp/postgres-upgrade:18
    container_name: postgres-upgrade
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TARGET_VERSION: ${POSTGRES_TARGET_VERSION}
    volumes:
      - ./data/postgres-ep:/var/lib/postgresql/
      - ./data/postgres-ep-old:/var/lib/postgresql/data_old:ro

  postgres:
    image: postgres:${POSTGRES_TARGET_VERSION}
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres-ep/data:/var/lib/postgresql/data
    depends_on:
      postgres-upgrade:
        condition: service_completed_successfully

